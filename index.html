    border: 1px solid #00ff00;
    margin-top: 20px;
}

.progress {
    width: 0%;
    height: 20px;
    background: #00ff00;
}

.glitch {
    color: red;
    font-size: 24px;
    animation: blink 0.2s infinite;
}

@keyframes blink {
    0% {opacity: 1;}
    50% {opacity: 0;}
    100% {opacity: 1;}

<body>

<div class="container">

    "Mengaktifkan kamera...",
    "Mengakses mikrofon...",
    "Copying important data..."
];

let interval = setInterval(() => {
    progress += Math.random() * 8;
    if (progress > 100) progress = 100;

    bar.style.width = progress + "%";

    if (Math.random() > 0.6) {
        let msg = messages[Math.floor(Math.random() * messages.length)];
        log.innerHTML += "> " + msg + "<br>";
    }

    if (progress >= 100) {
        clearInterval(interval);

        text.innerHTML = "ACCESS GRANTED";
        text.classList.add("glitch");

        setTimeout(showHackedScreen, 2000);

}, 300);
